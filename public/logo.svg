<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo marrón con degradado vertical -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5832"/>
      <stop offset="55%" stop-color="#5a3618"/>
      <stop offset="100%" stop-color="#321e0e"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Tapa del libro: cuero marrón con degradado -->
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7a4a26"/>
      <stop offset="50%" stop-color="#5e3517"/>
      <stop offset="100%" stop-color="#42260e"/>
    </linearGradient>

    <!-- Lomo dorado vertical (banda a la izquierda) -->
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a07635"/>
      <stop offset="50%" stop-color="#f0c878"/>
      <stop offset="100%" stop-color="#a07635"/>
    </linearGradient>

    <!-- Marco dorado exterior -->
    <linearGradient id="goldFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0c878"/>
      <stop offset="50%" stop-color="#d4a55f"/>
      <stop offset="100%" stop-color="#a07635"/>
    </linearGradient>

    <!-- Emblema central (medallón) -->
    <radialGradient id="medallion" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#f4d088"/>
      <stop offset="60%" stop-color="#d4a55f"/>
      <stop offset="100%" stop-color="#8a5e2a"/>
    </radialGradient>

    <!-- Sombra del libro -->
    <filter id="bookShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Brillo sutil en el cuero -->
    <linearGradient id="leatherHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="40%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <!-- Costura (hilo dorado del lomo) -->
    <pattern id="stitching" x="0" y="0" width="10" height="14" patternUnits="userSpaceOnUse">
      <rect x="3" y="0" width="4" height="6" fill="#3a2008" opacity="0.7"/>
    </pattern>
  </defs>

  <!-- Fondo + vignette -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#vignette)"/>

  <!-- Marco ornamental exterior (doble línea + esquinas) -->
  <rect x="14" y="14" width="484" height="484" rx="8" ry="8"
        fill="none" stroke="url(#goldFrame)" stroke-width="6"/>
  <rect x="24" y="24" width="464" height="464" rx="4" ry="4"
        fill="none" stroke="#d4a55f" stroke-width="1" stroke-opacity="0.5"/>
  <g fill="#d4a55f" opacity="0.85">
    <polygon points="34,34 40,28 46,34 40,40"/>
    <polygon points="466,34 472,28 478,34 472,40"/>
    <polygon points="34,478 40,472 46,478 40,484"/>
    <polygon points="466,478 472,472 478,478 472,484"/>
  </g>

  <!-- ====== Libro cerrado (portada) ====== -->
  <g filter="url(#bookShadow)">
    <!-- Sombra base debajo del libro -->
    <ellipse cx="256" cy="430" rx="170" ry="14" fill="#000" opacity="0.4"/>

    <!-- Cuerpo del libro (portada rectangular con bordes redondeados suaves) -->
    <rect x="96" y="100" width="320" height="312" rx="6" ry="6"
          fill="url(#leather)" stroke="#2a1606" stroke-width="2"/>

    <!-- Brillo del cuero (highlight superior) -->
    <rect x="96" y="100" width="320" height="312" rx="6" ry="6"
          fill="url(#leatherHighlight)"/>

    <!-- Lomo dorado vertical (banda a la izquierda) -->
    <rect x="96" y="100" width="56" height="312"
          fill="url(#spine)" stroke="#7a4e29" stroke-width="1"/>
    <!-- Costura del lomo (hileras de puntos) -->
    <rect x="100" y="112" width="4" height="288" fill="url(#stitching)"/>
    <rect x="142" y="112" width="4" height="288" fill="url(#stitching)"/>

    <!-- Borde interior decorativo (doble marco) en la portada -->
    <rect x="170" y="120" width="226" height="272" rx="3" ry="3"
          fill="none" stroke="#d4a55f" stroke-width="2" opacity="0.85"/>
    <rect x="178" y="128" width="210" height="256" rx="2" ry="2"
          fill="none" stroke="#d4a55f" stroke-width="1" opacity="0.55"/>

    <!-- Medallón central con "EB" (monograma) -->
    <circle cx="283" cy="220" r="52"
            fill="url(#medallion)" stroke="#7a4e29" stroke-width="2.5"/>
    <circle cx="283" cy="220" r="44"
            fill="none" stroke="#3a2008" stroke-width="1" opacity="0.4"/>

    <!-- Letras "EB" en serif dorado oscuro -->
    <text x="283" y="234" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="46" font-weight="bold"
          fill="#3a2008" letter-spacing="-2">EB</text>

    <!-- Título grabado en la portada (debajo del medallón) -->
    <text x="283" y="305" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="22" font-weight="bold"
          fill="#d4a55f" letter-spacing="4">ELMUBE</text>
    <text x="283" y="335" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="18" font-weight="normal"
          fill="#d4a55f" letter-spacing="8" opacity="0.85">BOOKS</text>

    <!-- Línea decorativa bajo el título -->
    <line x1="220" y1="355" x2="346" y2="355" stroke="#d4a55f" stroke-width="1" opacity="0.6"/>
    <circle cx="283" cy="355" r="2.5" fill="#d4a55f" opacity="0.8"/>

    <!-- Páginas visibles en el borde inferior (filete dorado) -->
    <rect x="100" y="408" width="312" height="4" fill="#f0c878"/>
    <rect x="100" y="404" width="312" height="2" fill="#a07635" opacity="0.6"/>
    <rect x="100" y="412" width="312" height="2" fill="#3a2008" opacity="0.5"/>

    <!-- Pequeña marca ornamental arriba del lomo (sello) -->
    <g transform="translate(124 130)" opacity="0.9">
      <circle r="10" fill="none" stroke="#3a2008" stroke-width="1.5"/>
      <circle r="6" fill="#3a2008" opacity="0.6"/>
      <circle r="3" fill="#d4a55f"/>
    </g>
    <g transform="translate(124 382)" opacity="0.9">
      <circle r="10" fill="none" stroke="#3a2008" stroke-width="1.5"/>
      <circle r="6" fill="#3a2008" opacity="0.6"/>
      <circle r="3" fill="#d4a55f"/>
    </g>
  </g>

  <!-- Brillo superior difuso -->
  <ellipse cx="256" cy="120" rx="180" ry="35" fill="#fff" opacity="0.05"/>
</svg>
